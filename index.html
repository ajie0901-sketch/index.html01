<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>噗噗恰恰多元化 - 尊榮導航叫車系統</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-black text-white min-h-screen flex flex-col items-center font-sans select-none">

    <header class="w-full max-w-md p-4 text-center border-b border-zinc-800">
        <h1 class="text-amber-400 font-bold tracking-widest text-lg">尊榮服務 | 專屬叫車</h1>
        <p class="text-xs text-zinc-400 mt-1">頂級車隊即時派遣 • Google 官方智能導航</p>
    </header>

    <div class="my-5 text-center">
        <h2 class="text-2xl font-black tracking-widest text-amber-400 italic">噗噗恰恰多元化</h2>
    </div>

    <main class="w-full max-w-md px-4 pb-12 flex-1">
        
        <div class="grid grid-cols-4 gap-1 bg-zinc-900 rounded-lg p-1 mb-6 border border-zinc-800 text-center">
            <button onclick="switchTab('instant')" id="btn-instant" class="py-2 text-xs font-medium rounded-md bg-amber-500 text-black transition cursor-pointer">即時叫車</button>
            <button onclick="switchTab('booking')" id="btn-booking" class="py-2 text-xs font-medium rounded-md text-zinc-400 transition cursor-pointer">預約行程</button>
            <button onclick="switchTab('estimate')" id="btn-estimate" class="py-2 text-xs font-medium rounded-md text-zinc-400 transition cursor-pointer">預估車資</button>
            <button onclick="switchTab('settings')" id="btn-settings" class="py-2 text-xs font-medium rounded-md text-zinc-400 transition cursor-pointer">⚙️ 設定</button>
        </div>

        <div id="tab-instant" class="space-y-4">
            <button onclick="getGPSLocation('instant-from')" class="w-full bg-zinc-900 border border-amber-500/50 hover:border-amber-400 py-3 rounded-lg flex items-center justify-center space-x-2 text-amber-400 font-medium transition shadow-lg shadow-amber-500/10 cursor-pointer">
                <i class="fa-solid fa-location-crosshairs text-red-500 animate-pulse"></i>
                <span>GPS 目前位置自動定位</span>
            </button>

            <div>
                <label class="block text-xs text-zinc-400 mb-1 tracking-wider">PICK UP LOCATION (上車地點)</label>
                <input type="text" id="instant-from" placeholder="請輸入上車完整地址" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs text-zinc-400 mb-1 tracking-wider">CAR TYPE (指定車款)</label>
                <select class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-amber-400">
                    <option>不指定車款 (優先派車)</option>
                    <option>Benz 賓士尊榮商務</option>
                    <option>BMW 寶馬豪華房車</option>
                    <option>Tesla 特斯拉純電智慧</option>
                    <option>Lexus 凌志舒適休旅</option>
                    <option>Audi 奧迪極致美學</option>
                </select>
            </div>

            <div class="flex items-center justify-between bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3">
                <span class="text-sm text-zinc-300">車輛數量</span>
                <div class="flex items-center space-x-4">
                    <button onclick="adjustCount(-1)" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-amber-400 hover:bg-zinc-700 font-bold cursor-pointer">-</button>
                    <span id="car-count" class="text-base font-semibold">1</span>
                    <button onclick="adjustCount(1)" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-amber-400 hover:bg-zinc-700 font-bold cursor-pointer">+</button>
                </div>
            </div>

            <button class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-lg tracking-wider transition mt-6 shadow-lg shadow-amber-500/20 cursor-pointer">
                立即確認叫車
            </button>
        </div>

        <div id="tab-booking" class="space-y-4 hidden">
            <div>
                <label class="block text-xs text-amber-400 mb-1 tracking-wider">DATE & TIME (預約時間)</label>
                <input type="datetime-local" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500 text-zinc-200">
                <p class="text-[10px] text-zinc-500 mt-1">※ 為確保服務品質，僅接受 30 分鐘後的預約行程</p>
            </div>

            <div>
                <label class="block text-xs text-amber-400 mb-1 tracking-wider">PICK UP (出發地)</label>
                <input type="text" placeholder="請輸入地址或地標" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs text-amber-400 mb-1 tracking-wider">DROP OFF (目的地)</label>
                <input type="text" placeholder="請輸入目的地" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <button class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-lg tracking-wider transition mt-6 cursor-pointer">
                確認預約行程
            </button>
        </div>

        <div id="tab-estimate" class="space-y-4 hidden">
            <button onclick="getGPSLocation('est-from')" class="w-full bg-zinc-900 border border-amber-500/50 hover:border-amber-400 py-2.5 rounded-lg flex items-center justify-center space-x-2 text-amber-400 text-xs font-medium transition shadow-sm cursor-pointer">
                <i class="fa-solid fa-location-crosshairs text-red-500 animate-pulse"></i>
                <span>使用 GPS 定位當前位置為出發地</span>
            </button>

            <div>
                <label class="block text-xs text-zinc-400 mb-1 tracking-wider">FROM (出發地)</label>
                <input type="text" id="est-from" placeholder="例如：台中火車站" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs text-zinc-400 mb-1 tracking-wider">TO (目的地)</label>
                <input type="text" id="est-to" placeholder="例如：逢甲夜市" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-amber-500">
            </div>

            <div id="map-container" class="hidden space-y-1">
                <div class="flex justify-between items-center">
                    <label class="text-xs text-amber-400 tracking-wider">🗺️ Google Maps 官方導航路線</label>
                    <span class="text-[10px] text-zinc-500">A -> B 導航中</span>
                </div>
                <div class="w-full h-56 rounded-xl border border-zinc-800 overflow-hidden shadow-inner bg-zinc-900">
                    <iframe id="google-map-frame" width="100%" height="100%" style="border:0;" loading="lazy" src=""></iframe>
                </div>
            </div>

            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 text-center my-2 shadow-lg">
                <p class="text-xs text-zinc-400">ESTIMATE 車資預估結果</p>
                <div id="result-price" class="text-3xl font-black text-amber-400 my-2">NT$ --</div>
                <p id="result-info" class="text-xs text-zinc-500">請輸入起終點並點擊計算</p>
            </div>

            <button onclick="calculateGoogleRouteAndFare()" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3.5 rounded-lg tracking-wider transition shadow-lg shadow-amber-500/20 cursor-pointer">
                開始計算車資與載入 Google 導航
            </button>
        </div>

        <div id="tab-settings" class="space-y-4 hidden">
            <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-5 space-y-4">
                <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
                    <h3 class="text-sm font-bold text-amber-400 tracking-wider">⚙️ 系統管理與計費設定</h3>
                    <span id="lock-status" class="text-xs text-red-400 font-medium">🔒 尚未解鎖</span>
                </div>

                <div id="auth-box" class="space-y-3 py-2">
                    <p class="text-xs text-zinc-400">請輸入管理員密碼以存取修改權限：</p>
                    <div class="flex space-x-2">
                        <input type="password" id="admin-pass" placeholder="輸入密碼" class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-200 focus:outline-none focus:border-amber-500">
                        <button onclick="unlockSettings()" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 py-2 rounded-lg text-sm transition cursor-pointer">解鎖</button>
                    </div>
                </div>

                <div id="settings-content" class="space-y-4 hidden pt-2">
                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">1. 起步價 (NT$)</label>
                        <input type="number" id="rate-base" value="75" class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-amber-400">
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">2. 分鐘價 (NT$/分鐘)</label>
                        <input type="number" id="rate-min" value="3" class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-amber-400">
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">3. 公里價 (NT$/公里)</label>
                        <input type="number" id="rate-km" value="15" class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-amber-400">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">4-1. 超過幾公里</label>
                            <input type="number" id="rate-extra-km" value="20" class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-center text-zinc-200">
                        </div>
                        <div>
                            <label class="block text-xs text-zinc-400 mb-1">4-2. 每公里加收 (+元)</label>
                            <input type="number" id="rate-extra-price" value="10" class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-center text-zinc-200">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-zinc-400 mb-1">5. 夜間加成倍數 (例如 1.2 = 加收20%)</label>
                        <input type="number" step="0.1" id="rate-night" value="1.2" class="w-full bg-black border border-zinc-800 rounded-lg px-3 py-2 text-sm text-amber-400">
                    </div>

                    <p class="text-[11px] text-green-400 pt-1">✨ 設定修改後會自動套用到「預估車資」計算中！</p>
                </div>
            </div>
        </div>

    </main>

    <script>
        const ADMIN_PASSWORD = "az5858";

        // 🔐 分頁切換功能（已修正修復）
        function switchTab(tabName) {
            // 隱藏所有面板
            document.getElementById('tab-instant').classList.add('hidden');
            document.getElementById('tab-booking').classList.add('hidden');
            document.getElementById('tab-estimate').classList.add('hidden');
            document.getElementById('tab-settings').classList.add('hidden');

            // 移除所有按鈕的高亮樣式
            document.getElementById('btn-instant').className = "py-2 text-xs font-medium rounded-md text-zinc-400 transition cursor-pointer";
            document.getElementById('btn-booking').className = "py-2 text-xs font-medium rounded-md text-zinc-400 transition cursor-pointer";
            document.getElementById('btn-estimate').className = "py-2 text-xs font-medium rounded-md text-zinc-400 transition cursor-pointer";
            document.getElementById('btn-settings').className = "py-2 text-xs font-medium rounded-md text-zinc-400 transition cursor-pointer";

            // 顯示目標面板並高亮對應按鈕
            document.getElementById('tab-' + tabName).classList.remove('hidden');
            document.getElementById('btn-' + tabName).className = "py-2 text-xs font-medium rounded-md bg-amber-500 text-black transition shadow cursor-pointer";
        }

        // 解鎖管理設定
        function unlockSettings() {
            const inputVal = document.getElementById('admin-pass').value;
            if (inputVal === ADMIN_PASSWORD) {
                document.getElementById('auth-box').classList.add('hidden');
                document.getElementById('settings-content').classList.remove('hidden');
                document.getElementById('lock-status').innerText = "🔓 已解鎖";
                document.getElementById('lock-status').className = "text-xs text-green-400 font-medium";
            } else {
                alert("密碼錯誤！");
            }
        }

        // GPS 定位功能
        function getGPSLocation(targetInputId) {
            if (!navigator.geolocation) {
                alert("您的瀏覽器不支援定位功能");
                return;
            }
            
            const inputField = document.getElementById(targetInputId);
            inputField.value = "正在獲取 GPS 定位...";

            navigator.geolocation.getCurrentPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`, {
                        headers: { 'Accept-Language': 'zh-TW' }
                    });
                    const data = await response.json();
                    inputField.value = data.display_name || `緯度: ${lat.toFixed(4)}, 經度: ${lon.toFixed(4)}`;
                } catch (e) {
                    inputField.value = `緯度: ${lat.toFixed(4)}, 經度: ${lon.toFixed(4)}`;
                }
            }, (error) => {
                alert("無法取得位置，請確認是否授權瀏覽器定位權限。");
                inputField.value = "";
            }, { enableHighAccuracy: true });
        }

        // 車輛數量加減邏輯
        let count = 1;
        function adjustCount(amount) {
            count += amount;
            if (count < 1) count = 1;
            if (count > 9) count = 9;
            document.getElementById('car-count').innerText = count;
        }

        // 🗺️ 載入 Google 官方導航地圖與車資計算
        async function calculateGoogleRouteAndFare() {
            const fromText = document.getElementById('est-from').value.trim();
            const toText = document.getElementById('est-to').value.trim();

            if (!fromText || !toText) {
                alert("請填寫或定位出發地與目的地！");
                return;
            }

            const mapContainer = document.getElementById('map-container');
            const mapFrame = document.getElementById('google-map-frame');
            mapContainer.classList.remove('hidden');

            const googleEmbedUrl = `https://maps.google.com/maps?q=${encodeURIComponent(fromText)}%20to%20${encodeURIComponent(toText)}&output=embed&hl=zh-TW`;
            mapFrame.src = googleEmbedUrl;

            let mockKm = 8.5;
            let mockMin = 22;

            try {
                const resFrom = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(fromText)}`);
                const dataFrom = await resFrom.json();
                const resTo = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(toText)}`);
                const dataTo = await resTo.json();

                if (dataFrom.length > 0 && dataTo.length > 0) {
                    const lat1 = parseFloat(dataFrom[0].lat);
                    const lon1 = parseFloat(dataFrom[0].lon);
                    const lat2 = parseFloat(dataTo[0].lat);
                    const lon2 = parseFloat(dataTo[0].lon);

                    const R = 6371;
                    const dLat = (lat2 - lat1) * Math.PI / 180;
                    const dLon = (lon2 - lon1) * Math.PI / 180;
                    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                              Math.sin(dLon/2) * Math.sin(dLon/2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                    mockKm = (R * c * 1.3).toFixed(1);
                    if (mockKm < 2.0) mockKm = "3.5";
                    mockMin = Math.round(mockKm * 2.5);
                }
            } catch (e) {
                console.log("使用預估數據");
            }

            const baseFare = parseFloat(document.getElementById('rate-base')?.value) || 75;
            const minRate = parseFloat(document.getElementById('rate-min')?.value) || 3;
            const kmRate = parseFloat(document.getElementById('rate-km')?.value) || 15;
            const extraKmThreshold = parseFloat(document.getElementById('rate-extra-km')?.value) || 20;
            const extraKmRate = parseFloat(document.getElementById('rate-extra-price')?.value) || 10;

            let distance = parseFloat(mockKm);
            let total = baseFare + (distance * kmRate) + (mockMin * minRate);
            
            if (distance > extraKmThreshold) {
                let overKm = distance - extraKmThreshold;
                total += overKm * extraKmRate;
            }

            document.getElementById('result-price').innerText = `NT$ ${Math.round(total)}`;
            document.getElementById('result-info').innerText = `導航距離：${mockKm} 公里 | 預估行車時間：${mockMin} 分鐘`;
        }
    </script>
</body>
</html>
